name: Deploy docs

on:
  push:
    branches: [main]
  # Manual redeploy, e.g. after enabling Pages or changing repository settings.
  workflow_dispatch:

# Pages deploys from an artifact, so nothing built is ever committed.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish so a deploy is not left
# half-applied, unlike the cancel-in-progress used for PR checks.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build docs
        # The site is served from a repository subpath; astro.config.mjs reads this.
        # DOCS_BASE must also be declared in turbo.json's build task — turbo filters
        # the task environment, and an undeclared variable is silently dropped.
        env:
          DOCS_BASE: /${{ github.event.repository.name }}
        # Builds @arun-dev/tokens and @arun-dev/ui first via the turbo task graph,
        # so the docs always reflect the source in this commit rather than npm.
        run: pnpm turbo run build --filter=@arun-dev/docs

      # A base-path regression produces a site that loads but has no CSS or JS,
      # which CI would otherwise report as a successful deploy.
      - name: Verify the base path was applied
        run: |
          if ! grep -q 'href="/arun-design-system/_astro/' apps/docs/dist/index.html; then
            echo "::error::Built assets are missing the /arun-design-system base path."
            grep -oE '(href|src)="/[^"]*\.(css|js)"' apps/docs/dist/index.html | sort -u || true
            exit 1
          fi
          echo "Base path applied to $(grep -oc 'href="/arun-design-system/' apps/docs/dist/index.html) references."

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
