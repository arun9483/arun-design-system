name: Release

on:
  push:
    branches: [main]

env:
  # Git hooks are redundant in CI (the workflow runs the same checks) and the
  # changesets version commit would fail the commitlint commit-msg hook.
  HUSKY: 0

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the job's OIDC token is exchanged with npm for a
  # short-lived publish credential, so no npm token is stored anywhere.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Still v1, and v1 already targets node24 — this pin costs no deprecation
      # warning. v2 requires github-token as an explicit input rather than the
      # GITHUB_TOKEN environment variable and renames several inputs, a migration
      # that touches the publish path and cannot be rehearsed without cutting a real
      # release. Worth doing deliberately, not as part of a runtime bump.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        # No NPM_TOKEN: without it, changesets/action writes no token .npmrc and
        # leaves auth to npm trusted publishing. `pnpm publish` packs, then runs
        # `npm publish` — npm >= 11.5.1 (Node 24's) does the OIDC exchange, and
        # attaches provenance. Each package's trusted publisher on npmjs.com names
        # this repository and this workflow file, release.yml: rename it and
        # publishing stops.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
