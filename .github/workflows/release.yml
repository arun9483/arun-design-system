name: Release

on:
  push:
    branches: [main]

env:
  # Git hooks are redundant in CI: the workflow runs the same checks.
  HUSKY: 0

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the job's OIDC token is exchanged with npm for a
  # short-lived publish credential, so no npm token is stored anywhere.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned to a release: unlike v1, v2 has no moving major tag.
      # v2 works only with @changesets/cli 3. It learns what was published from the
      # CHANGESETS_OUTPUT file `changeset publish` writes (v1 parsed log lines that
      # cli 3 no longer prints), so tags and GitHub releases follow every publish.
      # The GitHub token defaults to this job's; the release commit, PR and tags go
      # through the GitHub API and are signed.
      - name: Create release PR or publish to npm
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm run version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        # No npm token anywhere: `pnpm publish` (pnpm 11 publishes itself, without the
        # npm CLI) exchanges this job's OIDC token for a publish credential, and each
        # package's publishConfig.provenance attaches provenance. Each package's
        # trusted publisher on npmjs.com names this repository and this workflow
        # file, release.yml, and must allow direct publishing: rename the file and
        # publishing stops.
