# PR + main gate — thin consumer of frontend-platform-kit reusable workflows.
# Always pin to a tag (@v1), never @main. Library-only repo: no lighthouse/e2e;
# release publishing stays in release.yml (changesets).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: arun9483/frontend-platform-kit/.github/workflows/quality.yml@v1
    secrets: inherit

  security:
    uses: arun9483/frontend-platform-kit/.github/workflows/security.yml@v1

  # Behaviour jsdom cannot run — <dialog>, the top layer, real focus and keys — in
  # Chromium, Firefox and WebKit. Kept out of the shared quality job, whose `pnpm test` stays
  # jsdom-only; the Playwright image ships the browsers, so nothing is downloaded per run. The image tag
  # must match the `playwright` devDependency in packages/headless.
  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      # The image's browsers live here; without it Playwright looks under $HOME/.cache.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup
        uses: arun9483/frontend-platform-kit/actions/setup-node-pnpm@v1

      - name: Browser tests
        run: pnpm test:browser
