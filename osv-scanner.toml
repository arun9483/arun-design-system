# Vulnerability waivers for the osv-scanner CI gate (frontend-platform-kit
# security.yml). Each entry needs a justification, an owner, and an expiry
# date <= 90 days out. No permanent exceptions.
#
# Currently empty: every known advisory is cleared by a real version bump.
# Prefer bumping the pinned `pnpm.overrides` entry over adding a waiver here —
# an override pinned to a version that later becomes vulnerable is the failure
# mode this file exists to avoid, not to paper over.
