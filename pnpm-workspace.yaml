packages:
  - 'packages/*'
  - 'apps/*'

# React is a peer dependency of both published packages and must be one copy in the
# workspace: two copies give each its own hook dispatcher, and hooks throw. Declaring
# the versions once removes the possibility of drift between packages.
catalog:
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  # The unit-test DOM for every package. jsdom bundles undici for fetch and moves its major
  # with jsdom's, so separate jsdom pins meant separate undici majors — and a security pin
  # for each. One version here keeps it to one copy.
  jsdom: 30.0.1
