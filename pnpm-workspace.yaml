packages:
  - 'packages/*'
  - 'apps/*'

# React is a peer dependency of both published packages and must be one copy in the
# workspace: two copies give each its own hook dispatcher, and hooks throw. Declaring
# the versions once removes the possibility of drift between packages.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # The unit-test DOM for every package. jsdom bundles undici for fetch and moves its major
  # with jsdom's, so separate jsdom pins meant separate undici majors — and a security pin
  # for each. One version here keeps it to one copy.
  jsdom: 30.1.2

# Settings pnpm reads from here (pnpm 11 ignores the `pnpm` field of package.json and
# reads only auth and registry from .npmrc).
saveExact: true

# Supply-chain buffer: a version is installed only once it is a day old (pnpm 11's default,
# kept on purpose). These exact versions, from the 2026-10-08 upgrade, were under a day old
# when pnpm 11 arrived; remove them once they pass a day (after 2026-10-09 14:35 UTC).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@asamuzakjp/css-color@7.1.4'
  - 'astro@7.3.7'
  - 'cac@7.0.1'
  - 'playwright-core@1.64.0'
  - 'playwright@1.64.0'
  - 'vite@8.3.4'

allowBuilds:
  esbuild: true

# eslint-plugin-react and eslint-plugin-jsx-a11y stop at ESLint 9; they run on 10 through
# @eslint/compat (packages/eslint-config).
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'
    'eslint-plugin-react>eslint': '10'

overrides:
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.4
  'brace-expansion@5': 5.0.12
  'dompurify@3': 3.4.16
  'fast-uri@3': 3.1.8
  'js-yaml@3': 3.15.2
  'js-yaml@4': 4.3.2
  'nanoid@3': 3.3.18
  'postcss@8': 8.5.26
  'undici@8': 8.10.2
  'esbuild@0.27': 0.28.1
  'devalue@5': 5.9.3
  'katex@0': 0.18.2
  'postcss-selector-parser@6': 7.1.6
  'sharp@0': 0.35.5
  'smol-toml@1': 1.9.0
  'source-map-js@1': 1.2.2
